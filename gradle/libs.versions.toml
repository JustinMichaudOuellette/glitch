[versions]
agp = "9.5.0"
coreKtx = "1.19.1"
coreSplashScreen = "1.2.0"
junit = "4.13.2"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
materialIcons = "1.7.8"
androidxTestJunit = "1.3.0"
